
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Online T-Shirt Store</title>
    <style>
        .product-img {
            width: 100%;
            height: auto;
            transition: transform 0.2s;
        }
        .product-img:hover {
            transform: scale(1.05);
        }
        .footer-logo {
            height: 50px; /* Adjust height as needed */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center my-4">Welcome to crossing Ts</h1>
        <div class="row">
            <!-- Product 1 -->
            <div class="col-md-4 mb-4">
                <div class="card">
                    <img src="./Bootstrap/tshirt1.jpg" alt="T-Shirt 1" class="product-img card-img-top">
                    <div class="card-body">
                        <h5 class="card-title">My Age</h5>
                        <p class="card-text">Price: R150.00</p>
                        <button class="btn btn-primary">Buy</button>
                    </div>
                </div>
            </div>
            <!-- Product 2 -->
            <div class="col-md-4 mb-4">
                <div class="card">
                    <img src="./Bootstrap/tshirt2.jpg" alt="T-Shirt 2" class="product-img card-img-top">
                    <div class="card-body">
                        <h5 class="card-title">E=MC</h5>
                        <p class="card-text">Price: R200.00</p>
                        <button class="btn btn-primary">Buy</button>
                    </div>
                </div>
            </div>
            <!-- Product 3 -->
            <div class="col-md-4 mb-4">
                <div class="card">
                    <img src="./Bootstrap/tshirt3.jpg" alt="T-Shirt 3" class="product-img card-img-top">
                    <div class="card-body">
                        <h5 class="card-title">Wanna Count</h5>
                        <p class="card-text">Price: R250.00</p>
                        <button class="btn btn-primary">Buy</button>
                    </div>
                </div>
            </div>
            <!-- Repeat the structure for additional products -->
            <!-- Product 4 -->
            <div class="col-md-4 mb-4">
                <div class="card">
                    <img src="./Bootstrap/tshirt4.jpg" alt="T-Shirt 4" class="product-img card-img-top">
                    <div class="card-body">
                        <h5 class="card-title">Flavor Town</h5>
                        <p class="card-text">Price: R380.00</p>
                        <button class="btn btn-primary">Buy</button>
                    </div>
                </div>
            </div>
            <!-- Product 5 -->
            <div class="col-md-4 mb-4">
                <div class="card">
                    <img src="./Bootstrap/tshirt5.jpg" alt="T-Shirt 5" class="product-img card-img-top">
                    <div class="card-body">
                        <h5 class="card-title">Fluent in Awkward</h5>
                        <p class="card-text">Price: R160.00</p>
                        <button class="btn btn-primary">Buy</button>
                    </div>
                </div>
            </div>
            <!-- Product 6 -->
            <div class="col-md-4 mb-4">
                <div class="card">
                    <img src="./Bootstrap/tshirt6.jpg" alt="T-Shirt 6" class="product-img card-img-top">
                    <div class="card-body">
                        <h5 class="card-title">Shakin It</h5>
                        <p class="card-text">Price: R220.00</p>
                        <button class="btn btn-primary">Buy</button>
                    </div>
                </div>
            </div>
            <!-- Product 7 -->
            <div class="col-md-4 mb-4">
                <div class="card">
                    <img src="./Bootstrap/tshirt7.jpg" alt="T-Shirt 7" class="product-img card-img-top">
                    <div class="card-body">
                        <h5 class="card-title">Survivor</h5>
                        <p class="card-text">Price: R350.00</p>
                        <button class="btn btn-primary">Buy</button>
                    </div>
                </div>
            </div>
            <!-- Product 8 -->
            <div class="col-md-4 mb-4">
                <div class="card">
                    <img src="./Bootstrap/tshirt8.jpg" alt="T-Shirt 8" class="product-img card-img-top">
                    <div class="card-body">
                        <h5 class="card-title">Weird-AL</h5>
                        <p class="card-text">Price: R275.00</p>
                        <button class="btn btn-primary">Buy</button>
                    </div>
                </div>
            </div>
            <!-- Product 9 -->
            <div class="col-md-4 mb-4">
                <div class="card">
                    <img src="./Bootstrap/tshirt9.jpg" alt="T-Shirt 9" class="product-img card-img-top">
                    <div class="card-body">
                        <h5 class="card-title">Live Laugh</h5>
                        <p class="card-text">Price: R190.00</p>
                        <button class="btn btn-primary">Buy</button>
                    </div>
                </div>
            </div>
            <!-- Product 10 -->
            <div class="col-md-4 mb-4">
                <div class="card">
                    <img src="./Bootstrap/tshirt10.jpg" alt="T-Shirt 10" class="product-img card-img-top">
                    <div class="card-body">
                        <h5 class="card-title">Sleepy Rat</h5>
                        <p class="card-text">Price: R230.00</p>
                        <button class="btn btn-primary">Buy</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="mt-5">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <form>
                        <div class="form-row">
                            <div class="col">
                                <input type="text" class="form-control" placeholder="Your Name">
                            </div>
                            <div class="col">
                                <input type="email" class="form-control" placeholder="Your Email">
                            </div>
                        </div>
                        <div class="form-group mt-2">
                            <textarea class="form-control" rows="2" placeholder="Your Message"></textarea>
                        </div>
                        <button type="submit" class="btn btn-secondary">Submit</button>
                    </form>
                </div>
                <div class="col-md-6 text-right">
                    <img src="./Bootstrap/logo.png" alt="Crossing Ts" class="footer-logo">
                </div>
            </div>
        </footer>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
